name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  lint:
    runs-on: ubuntu-24.04
    env:
      NIXPKGS_REF: nixos-26.05
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: treefmt
        run: |
          nix shell \
            github:NixOS/nixpkgs/${NIXPKGS_REF}#treefmt \
            github:NixOS/nixpkgs/${NIXPKGS_REF}#nixfmt \
            github:NixOS/nixpkgs/${NIXPKGS_REF}#deadnix \
            github:NixOS/nixpkgs/${NIXPKGS_REF}#shfmt \
            github:NixOS/nixpkgs/${NIXPKGS_REF}#shellcheck \
            github:NixOS/nixpkgs/${NIXPKGS_REF}#yamlfmt \
            github:NixOS/nixpkgs/${NIXPKGS_REF}#typos \
            -c treefmt --ci
  flake-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: nix flake check
        run: nix flake check --print-build-logs
      - name: evaluate all systems
        run: nix flake check --all-systems --no-build --print-build-logs
